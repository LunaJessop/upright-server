name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # lib/db.js refuses to load when DATABASE_URL is missing. This points
      # at nothing. The suite mocks the client and does not open a connection.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/upright_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
